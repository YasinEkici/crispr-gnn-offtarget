# Sprint 7D Graph C GATv2 mechanism ablation.
#
# This is a small, predeclared isolation sprint for the Sprint 7B Graph C GATv2
# rare-negative operating-point behavior. It is not model search.

experiment_name: sprint7d_graphc_gatv2_mechanism_ablation
task: sprint7d_graphc_gatv2_mechanism_ablation
sprint: sprint7d
seed: 42
run_id: null

data:
  dataset: mak2022
  config: configs/data/mak2022.yaml
  label_scheme: scheme_a
  split_id: sprint2_main_seed42
  split_manifest: outputs/splits/sprint2_guides.json
  graph_c_artifact_dir: data/processed/graphs/sprint5b

features:
  edge_feature_sets: [s5f2_energy]
  feature_set: S5F2_energy

graph:
  materialization: heterodata
  visibility_policy: strict_inductive_primary
  graph_c_schema: graph_c_context_observation
  graph_c_policy: carry_forward_sprint5b_graph_c_s5f2

model:
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  target_node_representation: target_observation_context_encoder
  attention:
    heads: 4
    concat: true
    dropout: 0.2
    edge_aware: true
    self_loop_edge_fill: 0.0
    gatv2_share_weights: false

training:
  loss: weighted_bce
  loss_params:
    pos_weight: auto
  clip_grad_norm: 1.0
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_min_lr: 0.00001
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  min_epochs: 5
  patience: 15
  device: cuda
  num_threads: 1
  use_compile: true
  use_amp: true

runs:
  - id: S7D_R1_no_context_edges
    model_name: gatv2_graph_c_sprint7d_no_context_edges
    architecture: gatv2
    role: graph_c_gatv2_without_context_similarity_topology
    ablation:
      drop_context_similarity_edges: true
      edge_blind_candidate_attention: false
      mask_target_observation_features: false

  - id: S7D_R2_edge_blind_attention
    model_name: gatv2_graph_c_sprint7d_edge_blind_attention
    architecture: gatv2
    role: graph_c_gatv2_candidate_s5f2_removed_from_attention_only
    ablation:
      drop_context_similarity_edges: false
      edge_blind_candidate_attention: true
      mask_target_observation_features: false

  - id: S7D_R3_mask_target_context_features
    model_name: gatv2_graph_c_sprint7d_mask_target_context_features
    architecture: gatv2
    role: graph_c_gatv2_direct_target_observation_features_masked
    ablation:
      drop_context_similarity_edges: false
      edge_blind_candidate_attention: false
      mask_target_observation_features: true

references:
  sprint7_results_csv: outputs/sprint7/gat_comparison.csv
  sprint7b_results_csv: outputs/sprint7b/gatv2_topology_comparison.csv
  sprint5b_graph_c_results_csv: outputs/sprint5b/graph_c/gcn_graph_c_results.csv

