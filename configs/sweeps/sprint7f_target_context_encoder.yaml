# Sprint 7F family-aware target-observation context encoder comparison.
#
# Fixed setting: Graph C + S5F2_energy + edge-aware GATv2 + weighted BCE,
# with Sprint 7D no-context-edge policy. Controlled variable: the
# target_observation encoder architecture before GATv2 message passing.

experiment_name: sprint7f_target_context_encoder
task: sprint7f_target_context_encoder
sprint: sprint7f
seed: 42
run_id: null

data:
  dataset: mak2022
  config: configs/data/mak2022.yaml
  label_scheme: scheme_a
  split_id: sprint2_main_seed42
  split_manifest: outputs/splits/sprint2_guides.json
  graph_c_artifact_dir: data/processed/graphs/sprint5b

features:
  edge_feature_sets: [s5f2_energy]
  feature_set: S5F2_energy
  target_observation_feature_table: target_observation_features

graph:
  materialization: heterodata
  visibility_policy: strict_inductive_primary
  graph_c_schema: graph_c_context_observation
  graph_c_policy: carry_forward_sprint5b_graph_c_s5f2
  canonical_context_similarity_policy: drop_for_sprint7f_target_encoder

model:
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  target_node_representation: target_observation_context_encoder
  attention:
    heads: 4
    concat: true
    dropout: 0.2
    edge_aware: true
    self_loop_edge_fill: 0.0
    gatv2_share_weights: false
    drop_context_similarity_edges: true
    edge_blind_candidate_attention: false

training:
  loss: weighted_bce
  loss_params:
    pos_weight: auto
  clip_grad_norm: 1.0
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_min_lr: 0.00001
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  min_epochs: 5
  patience: 15
  device: cuda
  num_threads: 1
  use_compile: true
  use_amp: true

runs:
  - id: S7F_R1_unified_deep_context_encoder
    model_name: gatv2_graph_c_sprint7f_unified_deep_context_encoder
    architecture: gatv2
    role: graph_c_gatv2_unified_deep_target_context_encoder
    target_context_encoder:
      type: unified_deep

  - id: S7F_R2_family_aware_context_encoder
    model_name: gatv2_graph_c_sprint7f_family_aware_context_encoder
    architecture: gatv2
    role: graph_c_gatv2_family_aware_target_context_encoder
    target_context_encoder:
      type: family_aware

  - id: S7F_R3_family_aware_experimental_emphasis
    model_name: gatv2_graph_c_sprint7f_family_aware_experimental_emphasis
    architecture: gatv2
    role: graph_c_gatv2_family_aware_experimental_emphasis_context_encoder
    target_context_encoder:
      type: family_aware_experimental_emphasis

references:
  sprint7_results_csv: outputs/sprint7/gat_comparison.csv
  sprint7b_results_csv: outputs/sprint7b/gatv2_topology_comparison.csv
  sprint7d_results_csv: outputs/sprint7d/graphc_gatv2_mechanism_ablation.csv
  sprint5b_graph_c_results_csv: outputs/sprint5b/graph_c/gcn_graph_c_results.csv

