# Sprint 7 GAT/GATv2 architecture comparison.
#
# Predeclared from Sprint 6 handoff. Only the model architecture varies. The
# graph, feature family, loss, split, preprocessing, checkpoint, and threshold
# policies remain frozen from Sprints 2-6.

experiment_name: sprint7_gat_gatv2_attention
task: sprint7_gat_gatv2_attention
sprint: sprint7
seed: 42
run_id: null

data:
  dataset: mak2022
  config: configs/data/mak2022.yaml
  label_scheme: scheme_a
  split_id: sprint2_main_seed42
  split_manifest: outputs/splits/sprint2_guides.json
  graph_artifact_dir: data/processed/graphs/sprint5

features:
  edge_feature_sets: [s5f2_energy]
  feature_set: S5F2_energy

graph:
  schema: graph_a_minimal_physical_target
  materialization: heterodata
  visibility_policy: strict_inductive_primary
  topology_policy: fixed_graph_a

model:
  name: gat_graph_a_sprint7
  architecture: gat
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  target_node_representation: zero_type_feature
  attention:
    heads: 4
    concat: true
    dropout: 0.2
    edge_aware: true
    self_loop_edge_fill: 0.0
    gatv2_share_weights: false

training:
  loss: weighted_bce
  loss_params:
    pos_weight: auto
  clip_grad_norm: 1.0
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_min_lr: 0.00001
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  min_epochs: 5
  patience: 15
  device: cuda
  num_threads: 1
  use_compile: true
  use_amp: true

runs:
  - id: S7R1_gat_edge_aware
    model_name: gat_graph_a_sprint7_edge_aware
    architecture: gat
    edge_aware_attention: true
    attention:
      heads: 4
      concat: true
      dropout: 0.2
      edge_aware: true
      self_loop_edge_fill: 0.0
    role: edge_aware_gat_tests_sprint6_architecture_hypothesis

  - id: S7R2_gatv2_edge_aware
    model_name: gatv2_graph_a_sprint7_edge_aware
    architecture: gatv2
    edge_aware_attention: true
    attention:
      heads: 4
      concat: true
      dropout: 0.2
      edge_aware: true
      self_loop_edge_fill: 0.0
      gatv2_share_weights: false
    role: edge_aware_gatv2_dynamic_attention_variant

optional_runs:
  - id: S7R3_gat_edge_blind_control
    model_name: gat_graph_a_sprint7_edge_blind_control
    architecture: gat
    edge_aware_attention: false
    attention:
      heads: 4
      concat: true
      dropout: 0.2
      edge_aware: false
      self_loop_edge_fill: 0.0
    role: optional_edge_blind_control_reproduces_gcn_message_passing_limitation_check

split_rules:
  guide_disjoint: true
  train_measured_only: true
  validation_measured_only: true
  test_measured_only: true
  exclude_experiment_id: 18

evaluation:
  protocol: headline_guide_level
  no_test_tuning: true
  regime: measured_only
  controlled_variable: model_architecture_only
  threshold_policy: validation_max_f1
  checkpoint_policy: validation_auprc
  attention_interpretation: model_interpretation_only_not_biological_causality

metrics:
  primary: auprc
  secondary: [auroc, f1, macro_f1, mcc, specificity, sensitivity, tn, fp, fn, tp]
  emphasis: [specificity, tn, mcc, macro_f1]

baseline_reference:
  model_name: xgboost_unweighted
  feature_set: F4
  test_auprc: 0.992522
  test_auroc: 0.938416
  test_mcc: 0.345198

references:
  sprint6_results_csv: outputs/sprint6/loss_comparison/sprint6_loss_comparison_results.csv

prior_context:
  sprint6_wbce:
    run_id: S6R0_wbce
    test_auprc: 0.976935
    test_auroc: 0.819972
    test_macro_f1: 0.722208
    test_mcc: 0.483719
    test_specificity: 0.289941
    test_sensitivity: 0.996087
    test_tn: 49
    test_fp: 120
    test_fn: 6
    test_tp: 1527
    weighted_bce_pos_weight: 0.1267
    edge_feature_columns: 268
  test_positive_prevalence: 0.900705

outputs:
  output_dir: outputs/sprint7
