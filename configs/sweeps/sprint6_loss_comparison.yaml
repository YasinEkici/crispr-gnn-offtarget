# Sprint 6 imbalance / loss comparison sweep.
#
# Predeclared and FROZEN 2026-06-06 (exec plan
# docs/exec-plans/active/006-sprint6-imbalance-loss-comparison.md, Slice 0).
# Only the training objective (loss / sampling) varies; every other axis is held
# constant at the Sprint 5 best setting (Graph A + S5F2_energy). Hyperparameters
# below must NOT be changed from test diagnostics (no-test-tuning contract).
#
# NOTE: this config requires the Slice 1 loss-registry refactor of
# src/crispr_gnn/training/gcn.py (which currently hard-locks weighted_bce) and
# scripts/run_sprint6_loss_comparison.py. It is the predeclaration artifact; it
# will not execute against the current code until those land.

experiment_name: sprint6_loss_comparison
task: sprint6_loss_comparison
sprint: sprint6
seed: 42
run_id: null

data:
  dataset: mak2022
  config: configs/data/mak2022.yaml
  label_scheme: scheme_a
  split_id: sprint2_main_seed42
  split_manifest: outputs/splits/sprint2_guides.json
  # Reuse the Sprint 5 Graph A artifacts that already carry the s5f2_energy edge
  # feature table. Sprint 6 does not rebuild graph artifacts.
  graph_artifact_dir: data/processed/graphs/sprint5

# Frozen feature set for EVERY run (held constant; not an ablation axis).
features:
  edge_feature_sets: [s5f2_energy]
  feature_set: S5F2_energy

graph:
  schema: graph_a_minimal_physical_target
  materialization: heterodata
  visibility_policy: strict_inductive_primary
  topology_policy: fixed_graph_a

model:
  name: gcn_graph_a_sprint6
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  target_node_representation: zero_type_feature

# Shared training defaults. The `loss` / `sampling` keys are overridden per run
# from the `runs` list below; everything else is identical across runs.
training:
  loss: weighted_bce
  clip_grad_norm: 1.0
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_min_lr: 0.00001
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  min_epochs: 5
  patience: 15
  device: cuda
  num_threads: 1
  use_compile: true
  use_amp: true

# Predeclared headline runs. The controlled variable is loss / sampling only.
# Direction note: the rare class here is the NEGATIVE, so class-asymmetric
# parameters protect negatives (the inverse of Gao/Guan low-prevalence settings).
runs:
  - id: S6R0_wbce
    loss: weighted_bce
    params:
      pos_weight: auto          # = negatives/positives from train (~0.1267)
    role: baseline_continuity_vs_sprint5_s5f2_energy

  - id: S6R1_bce_unw
    loss: bce_unweighted
    params:
      pos_weight: 1.0
    role: control_isolates_weighting_effect

  - id: S6R2_focal_g2_a25
    loss: focal
    params:
      gamma: 2.0
      alpha: 0.25               # alpha on positive term => 0.75 weight on rare negatives
    role: focal_validated_default_lin2017_guan2024

  - id: S6R3_focal_g1_a25
    loss: focal
    params:
      gamma: 1.0
      alpha: 0.25
    role: focal_milder_focusing_gamma_sensitivity

  - id: S6R4_focal_g2_a50
    loss: focal
    params:
      gamma: 2.0
      alpha: 0.50               # pure focusing, no class alpha (alpha-sensitivity hedge)
    role: focal_pure_focusing

  - id: S6R5_dice
    loss: generalized_dice
    params:
      epsilon: 1.0
      class_weights: inverse_volume   # Sudre 2017; NOT single-class positive Dice
    role: generalized_dice_sudre2017

  - id: S6R6_tversky_a70_b30
    loss: tversky
    params:
      alpha: 0.70               # FP weight (raise => penalize negatives-called-positive)
      beta: 0.30                # FN weight
      epsilon: 1.0
    role: tversky_specificity_oriented_inverted_salehi2017

  - id: S6R7_balanced_sampling
    loss: bce_unweighted
    params:
      pos_weight: 1.0
    sampling:
      strategy: balanced_subsample      # per-epoch positive subsampling; all negatives kept
      target_ratio: 1.0                 # 1:1 train batch class ratio
      scope: measured_only
      deterministic_by_seed: true
    role: sampling_axis_measured_only

# Optional / approval-gated. NOT executed by default; the runner must require an
# explicit opt-in flag. Reported separately from the headline loss table.
optional_runs:
  - id: S6R8_classbalanced_cui
    loss: class_balanced_bce
    params:
      beta: 0.999               # Cui 2019 effective-number reweighting
    role: optional_class_balanced_reweighting

  - id: S6R9_hard_neg_mining
    loss: weighted_bce
    params:
      pos_weight: auto
    sampling:
      strategy: hard_negative_mining
      scope: measured_only
    role: optional_likely_deferred_little_to_mine

  - id: S6S1_putative_augmented
    loss: tbd_best_headline_loss          # set to the best headline loss before running
    regime: putative_augmented_screening   # measured=0 as TRAINING-ONLY noisy negatives
    measured_zero_policy:
      train_only: true
      never_in_validation_or_test: true
      not_true_negatives: true
    role: optional_secondary_low_prevalence_screening_regime_not_headline

split_rules:
  guide_disjoint: true
  train_measured_only: true
  validation_measured_only: true
  test_measured_only: true
  exclude_experiment_id: 18

evaluation:
  protocol: headline_guide_level
  no_test_tuning: true
  regime: measured_only
  controlled_variable: loss_or_sampling_only
  threshold_policy: validation_max_f1        # frozen; same-contract with Sprints 2-5
  checkpoint_policy: validation_auprc

metrics:
  primary: auprc
  secondary: [auroc, f1, macro_f1, mcc, specificity, sensitivity, tn, fp, fn, tp]
  # Inverted-prevalence emphasis: negative-class recognition is where loss/sampling
  # changes are most visible (specificity, TNR, MCC, macro F1). AUPRC stays primary.
  emphasis: [specificity, tn, mcc, macro_f1]

baseline_reference:
  model_name: xgboost_unweighted
  feature_set: F4
  test_auprc: 0.992522
  test_auroc: 0.938416
  test_mcc: 0.345198

prior_context:
  sprint4_graph_a: { test_auprc: 0.966287, test_mcc: 0.300781 }
  sprint5_graph_a_s5f2_energy: { test_auprc: 0.976585, test_mcc: 0.477933 }
  test_positive_prevalence: 0.900705

outputs:
  output_dir: outputs/sprint6/loss_comparison
