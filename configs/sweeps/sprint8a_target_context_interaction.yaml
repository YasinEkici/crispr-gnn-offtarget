split_rules:
  guide_disjoint: true
  train_measured_only: true
  validation_measured_only: true
  test_measured_only: true
  exclude_experiment_id: 18

evaluation:
  protocol: headline_guide_level
  no_test_tuning: true
  regime: measured_only
  controlled_variable: target_context_interaction_delta
  selection_metric: validation_auprc
  threshold_policy: validation_max_f1
  checkpoint_policy: validation_auprc
  attention_interpretation: model_interpretation_only_not_biological_causality
  primary_ablation_reference: S8A_REF_S7F_R3

metrics:
  primary: auprc
  secondary: [auroc, f1, macro_f1, mcc, specificity, sensitivity, tn, fp, fn, tp]
  emphasis: [specificity, tn, mcc, macro_f1]

outputs:
  output_dir: outputs/sprint8a
