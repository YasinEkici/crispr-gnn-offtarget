# Sprint 8A target-context + context-edge interaction comparison.
#
# Fixed setting: Graph C + S5F2_energy + edge-aware GATv2 + weighted BCE, with the
# Sprint 7D no-context-edge policy and the Sprint 7F R3 family-aware
# experimental-emphasis encoder as the canonical base. Controlled variable: the
# predeclared Sprint 8A architecture deltas (learned family gate, head-only
# context-edge interaction, regularized experimental branch). The frozen GATv2
# attention/message passing is unchanged.

experiment_name: sprint8a_target_context_interaction
task: sprint8a_target_context_interaction
sprint: sprint8a
seed: 42
run_id: null

data:
  dataset: mak2022
  config: configs/data/mak2022.yaml
  label_scheme: scheme_a
  split_id: sprint2_main_seed42
  split_manifest: outputs/splits/sprint2_guides.json
  graph_c_artifact_dir: data/processed/graphs/sprint5b

features:
  edge_feature_sets: [s5f2_energy]
  feature_set: S5F2_energy
  target_observation_feature_table: target_observation_features

graph:
  materialization: heterodata
  visibility_policy: strict_inductive_primary
  graph_c_schema: graph_c_context_observation
  graph_c_policy: carry_forward_sprint5b_graph_c_s5f2
  canonical_context_similarity_policy: drop_for_sprint8a

model:
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  target_node_representation: target_observation_context_encoder
  attention:
    heads: 4
    concat: true
    dropout: 0.2
    edge_aware: true
    self_loop_edge_fill: 0.0
    gatv2_share_weights: false
    drop_context_similarity_edges: true
    edge_blind_candidate_attention: false

training:
  loss: weighted_bce
  loss_params:
    pos_weight: auto
  clip_grad_norm: 1.0
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_min_lr: 0.00001
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  min_epochs: 5
  patience: 15
  device: cuda
  num_threads: 1
  use_compile: true
  use_amp: true

# Five predeclared canonical runs (R0-R4). The base encoder is the Sprint 7F R3
# family_aware_experimental_emphasis; each run toggles exactly one predeclared
# delta (R3 is the family-gate + FiLM combination). All keep
# drop_context_similarity_edges=true and edge_aware=true (see §17.6).
runs:
  - id: S8A_R0_base_reference
    model_name: gatv2_graph_c_sprint8a_base_reference
    architecture: gatv2
    role: graph_c_gatv2_base_reference_reproduces_s7f_r3
    target_context_encoder:
      type: family_aware_experimental_emphasis
      family_gate: false
      gate_reduction: 4
      experimental_branch:
        bottleneck: null
        feature_dropout: 0.0
    context_edge_interaction: none
    interaction_edge_dim: 64

  - id: S8A_R1_family_gated_v2
    model_name: gatv2_graph_c_sprint8a_family_gated_v2
    architecture: gatv2
    role: graph_c_gatv2_learned_family_gate
    target_context_encoder:
      type: family_aware_experimental_emphasis
      family_gate: true
      gate_reduction: 4
      experimental_branch:
        bottleneck: null
        feature_dropout: 0.0
    context_edge_interaction: none
    interaction_edge_dim: 64

  - id: S8A_R2_context_edge_film
    model_name: gatv2_graph_c_sprint8a_context_edge_film
    architecture: gatv2
    role: graph_c_gatv2_context_edge_film_interaction
    target_context_encoder:
      type: family_aware_experimental_emphasis
      family_gate: false
      gate_reduction: 4
      experimental_branch:
        bottleneck: null
        feature_dropout: 0.0
    context_edge_interaction: film
    interaction_edge_dim: 64

  - id: S8A_R3_gated_plus_film
    model_name: gatv2_graph_c_sprint8a_gated_plus_film
    architecture: gatv2
    role: graph_c_gatv2_family_gate_plus_film_interaction
    target_context_encoder:
      type: family_aware_experimental_emphasis
      family_gate: true
      gate_reduction: 4
      experimental_branch:
        bottleneck: null
        feature_dropout: 0.0
    context_edge_interaction: film
    interaction_edge_dim: 64

  - id: S8A_R4_regularized_exp_branch
    model_name: gatv2_graph_c_sprint8a_regularized_exp_branch
    architecture: gatv2
    role: graph_c_gatv2_regularized_experimental_branch
    target_context_encoder:
      type: family_aware_experimental_emphasis
      family_gate: false
      gate_reduction: 4
      experimental_branch:
        bottleneck: 4
        feature_dropout: 0.3
    context_edge_interaction: none
    interaction_edge_dim: 64

references:
  sprint7f_results_csv: outputs/sprint7f/target_context_encoder_comparison.csv

