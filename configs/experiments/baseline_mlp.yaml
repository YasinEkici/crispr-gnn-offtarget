experiment_name: baseline_mlp
task: sprint2_mlp
sprint: sprint2
seed: 42

data_config: configs/data/mak2022.yaml
split_manifest: outputs/splits/sprint2_guides.json
results_path: outputs/results/baseline_results.csv
figures_dir: outputs/figures/sprint2
diagnostics_dir: outputs/diagnostics/sprint2

feature_sets:
  - F1
  - F2
  - F3
  - F4

include_balanced_train_weights: true
balanced_feature_sets:
  - F3
  - F4

mlp:
  hidden_dims: [128, 64]
  learning_rate: 0.001
  alpha: 0.0001
  batch_size: 512
  max_epochs: 200
  min_epochs: 20
  patience: 25
