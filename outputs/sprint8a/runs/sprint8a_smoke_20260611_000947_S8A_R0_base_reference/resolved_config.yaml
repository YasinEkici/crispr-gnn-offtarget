    self_loop_edge_fill: 0.0
  context_edge_interaction: none
  dropout: 0.2
  hidden_dim: 128
  interaction_edge_dim: 64
  mask_target_observation_features: false
  name: gatv2_graph_c_sprint8a_base_reference
  num_layers: 2
  target_context_encoder:
