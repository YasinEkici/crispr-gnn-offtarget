  dataset: mak2022
  graph_artifact_dir: data/processed/graphs/sprint7b
  graph_b_artifact_dir: data/processed/graphs/sprint7b
  graph_c_artifact_dir: data/processed/graphs/sprint5b
  label_scheme: scheme_a
  split_id: sprint2_main_seed42
  split_manifest: outputs/splits/sprint2_guides.json
evaluation:
  attention_interpretation: model_interpretation_only_not_biological_causality
  checkpoint_policy: validation_auprc
  controlled_variable: graph_topology_and_target_semantics_followup
  graph_c_interpretation: topology_and_target_semantics_not_topology_only
  no_test_tuning: true
  protocol: headline_guide_level
  regime: measured_only
  threshold_policy: validation_max_f1
experiment_name: sprint7b_gatv2_topology
features:
  edge_feature_sets:
  - s5f2_energy
  feature_set: S5F2_energy
graph:
  materialization: heterodata
  schema: graph_b_guide_similarity_control
  visibility_policy: strict_inductive_primary
metrics:
  emphasis:
  - specificity
  - tn
  - mcc
  - macro_f1
  primary: auprc
  secondary:
  - auroc
  - f1
  - macro_f1
  - mcc
  - specificity
  - sensitivity
  - tn
  - fp
  - fn
  - tp
