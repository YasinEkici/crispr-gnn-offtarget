  architecture: gatv2
  attention:
    concat: true
    dropout: 0.2
    edge_aware: true
    gatv2_share_weights: false
    heads: 4
    self_loop_edge_fill: 0.0
  dropout: 0.2
  hidden_dim: 128
  name: gatv2_graph_b_sprint7b_s5f2
  num_layers: 2
  target_node_representation: zero_type_feature
