split_rules:
  exclude_experiment_id: 18
  guide_disjoint: true
  test_measured_only: true
  train_measured_only: true
  validation_measured_only: true
sprint: sprint7b
sprint7b_run:
  architecture: gatv2
  feature_set: S5F2_energy
  graph_schema: graph_b_guide_similarity_control
  id: S7B_R2_graph_b_gatv2_s5f2
  loss: weighted_bce
  loss_params:
    pos_weight: auto
  role: graph_b_guide_similarity_topology_x_edge_aware_gatv2
task: sprint7b_gatv2_topology_attention
training:
  clip_grad_norm: 1.0
  device: cuda
  learning_rate: 0.001
  loss: weighted_bce
  loss_params:
    pos_weight: auto
  max_epochs: 300
  min_epochs: 5
  num_threads: 1
  patience: 15
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_min_lr: 1.0e-05
  scheduler_patience: 5
  use_amp: true
  use_compile: true
  weight_decay: 0.0001
