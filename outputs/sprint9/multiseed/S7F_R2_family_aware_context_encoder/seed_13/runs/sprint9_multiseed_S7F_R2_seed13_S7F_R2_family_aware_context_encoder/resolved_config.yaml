sprint7f_run:
  architecture: gatv2
  drop_context_similarity_edges: true
  feature_set: S5F2_energy
  graph_schema: graph_c_context_observation
  id: S7F_R2_family_aware_context_encoder
  loss: weighted_bce
  loss_params:
    pos_weight: auto
  role: graph_c_gatv2_family_aware_target_context_encoder
  target_context_encoder_type: family_aware
task: sprint7f_target_context_encoder
training:
  clip_grad_norm: 1.0
  device: cuda
  learning_rate: 0.001
  loss: weighted_bce
  loss_params:
    pos_weight: auto
  max_epochs: 300
  min_epochs: 5
  num_threads: 1
  patience: 15
  scheduler: reduce_on_plateau
