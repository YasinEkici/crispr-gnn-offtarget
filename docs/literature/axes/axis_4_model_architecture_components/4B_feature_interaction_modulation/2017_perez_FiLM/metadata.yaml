title: 'FiLM: Visual Reasoning with a General Conditioning Layer'
authors:
- Ethan Perez
- Florian Strub
- Harm de Vries
- Vincent Dumoulin
- Aaron Courville
abstract: 'We introduce a general-purpose conditioning method for neural networks
  called FiLM: Feature-wise Linear Modulation. FiLM layers influence neural network
  computation via a simple, feature-wise affine transformation based on conditioning
  information. We show that FiLM layers are highly effective for visual reasoning
  — answering image-related questions which require a multi-step, high-level process
  — a task which has proven difficult for standard deep learning methods that do not
  explicitly model reasoning.'
keywords:
- Feature-wise Linear Modulation
- FiLM
- neural networks
- visual reasoning
journal: ''
year: 2018
