title: Nucleosome breathing and remodeling constrain CRISPR-Cas9 function
authors:
- R Stefan Isaac
- Fuguo Jiang
- Jennifer A Doudna
- Wendell A Lim
- Geeta J Narlikar
- Ricardo Almeida
abstract: The CRISPR-Cas9 bacterial surveillance system has become a versatile tool
  for genome editing and gene regulation in eukaryotic cells, yet how CRISPR-Cas9
  contends with the barriers presented by eukaryotic chromatin is poorly understood.
  Here we investigate how the smallest unit of chromatin, a nucleosome, constrains
  the activity of the CRISPR-Cas9 system...
keywords: []
journal: eLife
year: 2016
