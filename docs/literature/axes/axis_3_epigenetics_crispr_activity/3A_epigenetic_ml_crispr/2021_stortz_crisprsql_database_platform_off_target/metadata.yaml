title: 'crisprSQL: a novel database platform for CRISPR/Cas off-target cleavage assays'
authors:
- Florian Stortz
- Peter Minary
abstract: With ongoing development of the CRISPR/Cas programmable nuclease system,
  applications in the area of in vivo therapeutic gene editing are increasingly within
  reach. However, non-negligible off-target effects remain a major concern for clinical
  applications... fuel development of computational off-target prediction algorithms.
