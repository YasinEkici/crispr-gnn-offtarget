axes:
  - id: axis_1_crispr_prediction_models
    title: "EKSEN 1 - GNN-tabanli ve sequence-tabanli CRISPR off-target / on-target tahmin modelleri"
    sections:
      - id: 1A_graph_based_crispr_models
        title: "1A. CRISPR icin cizge-tabanli modeller"
      - id: 1B_sequence_based_dl_baselines
        title: "1B. Sequence-tabanli derin ogrenme baseline'lari"
  - id: axis_2_imbalance_cost_sensitive_learning
    title: "EKSEN 2 - CRISPR ve genomikte sinif dengesizligi / maliyet-duyarli ogrenme"
    sections:
      - id: 2A_crispr_specific_imbalance
        title: "2A. CRISPR'a ozgu dengesizlik calismalari"
      - id: 2B_general_imbalance_foundations
        title: "2B. Genel dengesizlik / maliyet-duyarli ogrenme temelleri"
  - id: axis_3_epigenetics_crispr_activity
    title: "EKSEN 3 - Epigenetik ozellikler ve CRISPR-Cas9 aktivitesi"
    sections:
      - id: 3A_epigenetic_ml_crispr
        title: "3A. Epigenetigi entegre eden hesaplamali / ML makaleleri"
      - id: 3B_chromatin_epigenetics_cas9_biology
        title: "3B. Temel biyoloji - kromatin / epigenetik ve Cas9 aktivitesi"
  - id: axis_4_model_architecture_components
    title: "EKSEN 4 - Model mimari bilesenleri (Sprint 8 tasarim gerekçesi)"
    sections:
      - id: 4A_feature_fusion_gating
        title: "4A. Ogrenilen ozellik fuzyonu / gating"
      - id: 4B_feature_interaction_modulation
        title: "4B. Ozellik etkilesimi / FiLM-tarzi modulasyon"
      - id: 4C_regularization_robust_features
        title: "4C. Regularizasyon ve kirilgan ozellik kullanimi"
      - id: 4D_model_selection_practice
        title: "4D. Model secimi / leakage-guvenli degerlendirme pratigi"
      - id: 4E_graph_attention_backbones
        title: "4E. Graf-attention backbone ve kapasite-kontrollu kiyas"

