<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Graph A B C semantic comparison</title>
  <desc id="desc">Three-panel semantic comparison of Graph A, Graph B, and Graph C.</desc>
  <defs>
    <style>
      .bg { fill: #fbfdff; }
      .ink { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 52px; font-weight: 760; }
      .panelTitle { font-size: 34px; font-weight: 720; }
      .body { font-size: 27px; }
      .caption { font-size: 26px; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 3; }
      .nodeStrong { fill: #eef6ff; stroke: #2563eb; stroke-width: 4; }
      .guide { fill: #ecfeff; stroke: #0f766e; stroke-width: 3; }
      .edge { stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; }
      .edgeStrong { stroke: #2563eb; stroke-width: 4; stroke-linecap: round; }
      .soft { fill: #f1f5f9; }
      .accent { fill: #2563eb; }
      .teal { fill: #0f766e; }
      .orange { fill: #f97316; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="860"/>
  <text x="80" y="94" class="ink title">Graph A/B/C: temsil neyi değiştiriyor?</text>
  <text x="80" y="140" class="muted body">Graph C katkısı salt topoloji değil, düğüm semantiği değişimidir.</text>

  <g transform="translate(80 210)">
    <rect x="0" y="0" width="360" height="430" rx="36" class="soft"/>
    <text x="36" y="62" class="ink panelTitle">Graph A</text>
    <text x="36" y="104" class="muted body">fiziksel hedef şeması</text>
    <line x1="105" y1="230" x2="255" y2="230" class="edge"/>
    <circle cx="105" cy="230" r="58" class="node"/>
    <circle cx="255" cy="230" r="58" class="node"/>
    <text x="78" y="238" class="ink body">rehber</text>
    <text x="221" y="238" class="ink body">hedef</text>
    <text x="36" y="352" class="muted caption">Aynı fiziksel hedef tek</text>
    <text x="36" y="388" class="muted caption">düğümde temsil edilir.</text>
  </g>

  <g transform="translate(520 210)">
    <rect x="0" y="0" width="360" height="430" rx="36" class="soft"/>
    <text x="36" y="62" class="ink panelTitle">Graph B</text>
    <text x="36" y="104" class="muted body">rehber benzerliği kontrolü</text>
    <line x1="102" y1="185" x2="258" y2="185" class="edge"/>
    <line x1="180" y1="250" x2="102" y2="185" class="edge"/>
    <line x1="180" y1="250" x2="258" y2="185" class="edge"/>
    <circle cx="102" cy="185" r="48" class="guide"/>
    <circle cx="258" cy="185" r="48" class="guide"/>
    <circle cx="180" cy="250" r="58" class="node"/>
    <text x="75" y="193" class="ink body">g1</text>
    <text x="231" y="193" class="ink body">g2</text>
    <text x="146" y="258" class="ink body">hedef</text>
    <text x="36" y="352" class="muted caption">Rehber benzerliği ayrı bir</text>
    <text x="36" y="388" class="muted caption">kontrol sinyali olarak taşınır.</text>
  </g>

  <g transform="translate(960 210)">
    <rect x="0" y="0" width="360" height="430" rx="36" fill="#eef6ff"/>
    <text x="36" y="62" class="ink panelTitle">Graph C</text>
    <text x="36" y="104" class="muted body">hedef-gözlem şeması</text>
    <line x1="180" y1="148" x2="105" y2="255" class="edgeStrong"/>
    <line x1="180" y1="148" x2="255" y2="255" class="edgeStrong"/>
    <circle cx="180" cy="148" r="54" class="nodeStrong"/>
    <circle cx="105" cy="255" r="58" class="nodeStrong"/>
    <circle cx="255" cy="255" r="58" class="nodeStrong"/>
    <text x="145" y="156" class="ink body">hedef</text>
    <text x="65" y="263" class="ink body">gözlem 1</text>
    <text x="215" y="263" class="ink body">gözlem 2</text>
    <text x="36" y="352" class="ink caption">Aynı adres,</text>
    <text x="36" y="388" class="ink caption">farklı ziyaretler.</text>
  </g>

  <g transform="translate(80 710)">
    <circle cx="14" cy="14" r="14" class="accent"/>
    <text x="44" y="23" class="ink caption">Graph C, aynı fiziksel hedefi farklı hedef-gözlem bağlamlarıyla temsil eder.</text>
  </g>
  <g transform="translate(80 760)">
    <circle cx="14" cy="14" r="14" class="orange"/>
    <text x="44" y="23" class="muted caption">Oklar temsil akışını gösterir; biyolojik nedensellik göstermez.</text>
  </g>
</svg>
