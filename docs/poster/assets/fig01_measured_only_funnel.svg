<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Measured-only funnel</title>
  <desc id="desc">A clean Turkish measured-only data funnel for the CRISPR-Cas9 poster.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .ink { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font-size: 28px; }
      .body { font-size: 34px; }
      .label { font-size: 38px; font-weight: 650; }
      .num { font-size: 82px; font-weight: 750; letter-spacing: 0; }
      .caption { font-size: 26px; }
      .rule { stroke: #cbd5e1; stroke-width: 2; }
      .accent { fill: #2563eb; }
      .accent2 { fill: #0f766e; }
      .softBlue { fill: #dbeafe; }
      .softTeal { fill: #ccfbf1; }
      .softSlate { fill: #e2e8f0; }
      .line { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820"/>
  <text x="80" y="96" class="ink" style="font-size:54px;font-weight:760">Veri Sözleşmesi</text>
  <text x="80" y="142" class="muted body">Test iddiası yalnızca ölçülmüş veri evreninden kuruldu.</text>

  <g transform="translate(95 230)">
    <rect x="0" y="0" width="300" height="220" rx="34" class="softSlate"/>
    <text x="36" y="64" class="muted small">Tüm adaylar</text>
    <text x="36" y="146" class="ink num">310142</text>
  </g>

  <path d="M430 340 L515 340" class="line"/>
  <path d="M515 340 L493 326 M515 340 L493 354" class="line"/>

  <g transform="translate(545 230)">
    <rect x="0" y="0" width="300" height="220" rx="34" class="softBlue"/>
    <text x="36" y="64" class="muted small">Ölçülmüş veri evreni</text>
    <text x="36" y="146" class="ink num">25632</text>
  </g>

  <path d="M880 340 L965 340" class="line"/>
  <path d="M965 340 L943 326 M965 340 L943 354" class="line"/>

  <g transform="translate(995 230)">
    <rect x="0" y="0" width="300" height="220" rx="34" class="softTeal"/>
    <text x="36" y="64" class="muted small">Test evreni</text>
    <text x="36" y="146" class="ink num">1702</text>
  </g>

  <g transform="translate(150 530)">
    <circle cx="22" cy="22" r="22" class="accent"/>
    <text x="60" y="32" class="ink label">29 rehber</text>
  </g>
  <g transform="translate(455 530)">
    <circle cx="22" cy="22" r="22" class="accent2"/>
    <text x="60" y="32" class="ink label">1533 pozitif</text>
  </g>
  <g transform="translate(820 530)">
    <circle cx="22" cy="22" r="22" fill="#f97316"/>
    <text x="60" y="32" class="ink label">169 negatif</text>
  </g>

  <line x1="80" y1="635" x2="1320" y2="635" class="rule"/>
  <text x="80" y="695" class="ink caption">Doğrulanmamış adaylar (measured=0) test etiketi yapılmadı.</text>
  <text x="80" y="738" class="muted caption">Scheme A: cleavage_freq &gt; 1e-5; model ve eşik seçimi validation ile kilitlendi.</text>
</svg>
